name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # No `branches` filter on purpose. That filter matches the *base* branch, so with `[main]` a pull
  # request stacked on a feature branch triggered nothing at all — and pushes to a feature branch
  # trigger nothing either, since `push` is limited to main and tags. A stacked pull request therefore
  # had zero checks while looking reviewed, which is the same hole that let PR #30 carry a red suite
  # and ~38 never-executing tests for a month. Verify every pull request, whatever it targets.
  pull_request:

# The checks below were one sequential job until 2026-08-17. They share no artefacts — `dotnet format`
# loads the solution into an in-memory Roslyn workspace while `dotnet build` compiles to disk, so
# neither reuses the other's work and running them in either order cost the sum of both. Measured on
# one run: 85s total, of which format 25s and build 22s. Split into parallel jobs, wall clock becomes
# the slowest job rather than the sum. Runner minutes go up by about a third, which is free on a
# public repository.
#
# `release` gates on these jobs, and a skipped dependency would skip the release with it. So every job
# a release depends on must also run on tags — see the condition on `vulnerable`.

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # No explicit restore: dotnet format restores by default, and an explicit step ahead of it does
      # the same work plus one process start. Measured, see the build-test job.
      - name: Check format
        run: dotnet format --verify-no-changes ./src/Askyl.Dsm.WebHosting.slnx

  # Test stays with Build: `--no-build` needs the compiled output, so splitting them would mean
  # publishing and re-downloading artefacts to save nothing.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # No explicit restore step: dotnet build restores implicitly, so both spellings do exactly one
      # restore and the explicit one just adds a process start. Measured on three cold clones —
      # restore + `build --no-restore` came out at 7/5/4s against 6/4/4s for build alone, never the
      # other way round. The vulnerable job below keeps its restore, because `dotnet list package`
      # reads project.assets.json and does not produce it.
      - name: Build
        run: dotnet build /nr:false ./src/Askyl.Dsm.WebHosting.slnx

      - name: Test
        run: dotnet test ./src/Askyl.Dsm.WebHosting.Tests --no-build

  # No .NET here at all: markdownlint needs only the checkout, so this job finishes in seconds instead
  # of waiting behind a restore it never uses.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Only tracked files: .opencode/node_modules ships hundreds of third-party .md files that
      # do not meet this repository's rules and are not ours to reformat.
      - name: Lint markdown
        run: |
          npm install -g markdownlint-cli
          markdownlint $(git ls-files '*.md')

  # Off the pull-request path by decision, 2026-08-17. The dependency set moves with a Dependabot PR or
  # a deliberate bump, not with the average feature branch, so paying 10s on every push to a branch
  # bought little. `github.event_name == 'push'` covers both main and tags: gating on the branch name
  # instead would skip this on a tag and take `release` down with it.
  vulnerable:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./src/Askyl.Dsm.WebHosting.slnx

      # `dotnet list package --vulnerable` always exits 0, so its JSON output is inspected
      # instead. JSON also keeps this locale-independent, unlike grepping the table text.
      - name: Check for vulnerable packages
        working-directory: src
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulnerable.json
          count=$(jq '[.projects[].frameworks?[]? | (.topLevelPackages?[]?, .transitivePackages?[]?)] | length' vulnerable.json)

          if [ "$count" -gt 0 ]; then
            jq -r '.projects[] | .path as $p | .frameworks?[]? | (.topLevelPackages?[]?, .transitivePackages?[]?) | "\($p): \(.id) \(.resolvedVersion) [\([.vulnerabilities[].severity] | join(", "))]"' vulnerable.json
            echo "::error::$count vulnerable package(s) detected"
            exit 1
          fi

          echo "No vulnerable packages."

  # Format, build and test are not repeated here: the jobs above already ran them on this SHA.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [format, build-test, lint, vulnerable]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pigz jq

      - name: Cache .NET runtimes
        uses: actions/cache@v6
        with:
          path: src/spk-project/package/runtimes/downloads
          key: ${{ runner.os }}-runtimes-${{ hashFiles('src/Askyl.Dsm.WebHosting.Ui/appsettings.json') }}

      - name: Build SPK package
        run: bash src/scripts/build-spk.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SPK_FILE=$(ls dist/*.spk | head -1)
          gh release create "$TAG" \
            --title "Release ${TAG}" \
            --generate-notes \
            "$SPK_FILE"
